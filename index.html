const GRAV=2600,MAXFALL=940,WALK=250,RUN=400,ACC=2000,ACC_A=1500,FRIC=2400;
const JUMP_V=850,JUMP_CUT=0.42,STEP=1/60;
const SOLID=new Set(['#','G','B','?','M','U','P']);
let RS=1;
function resize(){
if(window.innerHeight>window.innerWidth&&window.matchMedia&&matchMedia('(hover:none) and (pointer:coarse)').matches&&typeof state!=='undefined'&&state==='playing')state='paused';
const s=Math.min(window.innerWidth/VW,window.innerHeight/VH);
cvs.style.width=(VW*s)+'px';cvs.style.height=(VH*s)+'px';
const dpr=Math.min(window.devicePixelRatio||1,2);
cvs.width=Math.round(VW*s*dpr);cvs.height=Math.round(VH*s*dpr);
RS=s*dpr;
}
window.addEventListener('resize',resize);
function rr(x,y,w,h,r){
r=Math.min(r,w/2,h/2);
ctx.beginPath();ctx.moveTo(x+r,y);
ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function text(str,x,y,size,align,color){
ctx.font='bold '+size+'px "Hiragino Sans","Yu Gothic UI",system-ui,sans-serif';
ctx.textAlign=align||'left';ctx.textBaseline='middle';
ctx.lineWidth=Math.max(3,size/7);ctx.strokeStyle='rgba(0,0,0,.65)';
ctx.strokeText(str,x,y);ctx.fillStyle=color||'#fff';ctx.fillText(str,x,y);
}
const Sfx={ctx:null,muted:false,
init(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
tone(f,f2,dur,type,vol,delay){
if(!this.ctx||this.muted)return;
const c=this.ctx,t0=c.currentTime+(delay||0);
const o=c.createOscillator(),g=c.createGain();
o.type=type||'square';o.frequency.setValueAtTime(Math.max(f,1),t0);
if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(f2,1),t0+dur);
g.gain.setValueAtTime(vol||0.05,t0);
g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+dur+0.03);},
jump(){this.tone(300,760,.15,'square',.05);},
coin(){this.tone(988,0,.07,'square',.05);this.tone(1319,0,.22,'square',.05,.07);},
stomp(){this.tone(240,90,.14,'triangle',.07);},
bump(){this.tone(170,110,.09,'square',.05);},
brick(){this.tone(520,120,.16,'sawtooth',.05);this.tone(300,80,.2,'square',.04,.03);},
power(){[523,659,784,1047].forEach((f,i)=>this.tone(f,0,.12,'square',.05,i*.06));},
shrink(){this.tone(700,250,.3,'sawtooth',.05);},
die(){this.tone(600,90,.7,'square',.06);},
flag(){[659,784,880,1047].forEach((f,i)=>this.tone(f,0,.1,'square',.05,i*.07));},
clear(){[523,659,784,1047,784,1047].forEach((f,i)=>this.tone(f,0,.16,'square',.05,i*.13));},
start(){this.tone(523,0,.1,'square',.05);this.tone(784,0,.18,'square',.05,.11);}};
const MELODY=[784,0,659,784,880,0,784,0,698,0,659,587,659,0,0,0,
659,0,587,659,784,0,659,0,587,0,523,587,659,0,0,0];
const BGM={on:true,next:0,i:0};
function bgmTick(){
if(!Sfx.ctx||!BGM.on||Sfx.muted||state!=='playing'){BGM.next=0;return;}
const c=Sfx.ctx;
if(!BGM.next){BGM.next=c.currentTime+0.05;BGM.i=0;}
while(BGM.next<c.currentTime+0.15){
const f=MELODY[BGM.i];
if(f)Sfx.tone(f,0,.13,'square',.028,BGM.next-c.currentTime);
BGM.next+=.155;BGM.i=(BGM.i+1)%MELODY.length;}}
function makeLevel(def){
const cols=def.cols;
const g=Array.from({length:ROWS},()=>new Array(cols).fill(' '));
const spawns=[];const o={flagCol:3,startCol:3};
const set=(x,y,c)=>{if(x>=0&&x<cols&&y>=0&&y<ROWS)g[y][x]=c;};
const A={
ground(a,b){for(let x=a;x<=b;x++){set(x,12,'#');set(x,13,'#');}},
set,
row(x0,x1,y,c){for(let x=x0;x<=x1;x++)set(x,y,c||'B');},
q(x,y,c){set(x,y,c||'?');},
coins(x0,x1,y){for(let x=x0;x<=x1;x++)set(x,y,'o');},
pipe(x,h){for(let i=0;i<h;i++){set(x,11-i,'P');set(x+1,11-i,'P');}},
stairs(x,n,dir){
if((dir||'up')==='up'){for(let i=0;i<n;i++)for(let k=0;k<=i;k++)set(x+i,11-k,'G');}
else{for(let i=0;i<n;i++)for(let k=0;k<n-i;k++)set(x+i,11-k,'G');}},
plat(x0,x1,y){A.row(x0,x1,y,'G');},
spikes(x0,x1){for(let x=x0;x<=x1;x++)set(x,11,'^');},
enemy(x,type,feetRow){spawns.push({cx:x,feetRow:feetRow||12,type:type||'poko'});},
flag(x){o.flagCol=x;for(let y=3;y<=11;y++)set(x,y,'|');},
start(x){o.startCol=x;}};
def.build(A);
o.g=g;o.cols=cols;o.spawns=spawns;o.def=def;
o.bumps=new Map();o.time=300;o.timeAcc=0;
return o;}

{name:'1-3 ふしぎのきょうこく',cols:175,build(A){

let state='title',t=0,score=0,coinsN=0,lives=3,levelIndex=0;
let level=null,ents=[],particles=[],cam={x:0};
const player={x:120,y:446,w:26,h:34,vx:0,vy:0,facing:1,onGround:false,
big:false,invuln:0,walk:0};
const input={left:false,right:false,jump:false,run:false};
let hiScore=0,hiDirty=false,stompCombo=0;
try{hiScore=parseInt(localStorage.getItem('mike_hi'),10)||0;}catch(e){}
function popup(x,y,str,color){particles.push({kind:'pop',x:x,y:y,vx:0,vy:-70,t:.9,str:str,color:color||'#fff'});}
function addCoin(){
coinsN++;
if(coinsN%50===0){lives++;popup(player.x,player.y-20,'1UP!','#7dff9a');Sfx.power();}}
let jumpBuffer=0,coyote=0,deathT=0,levelBanner=0,flagPhase='',flagT=0;
let flagBonus=0,timeBonus=0,castleCol=0,clearPending=false;
function cell(x,y){
if(!level)return' ';
if(x<0||x>=level.cols)return'#';
if(y<0||y>=ROWS)return' ';
return level.g[y][x];}
function overlap(a,b){
return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function addBump(x,y){level.bumps.set(x+','+y,0);}
function spawnCoinPop(x,y){
particles.push({kind:'coin',x:x*TILE+14,y:y*TILE-8,vx:0,vy:-430,t:.75});}
function spawnMush(x,y){
ents.push({type:'mush',x:x*TILE+6,y:y*TILE-28,w:28,h:28,vx:0,vy:0,dir:1,
spd:95,active:true,squish:0,dead:false,onGround:true,walk:0,hopT:0});}
function debris(x,y){
for(let i=0;i<4;i++)
particles.push({kind:'brick',x:x*TILE+(i%2)*20+4,y:y*TILE+Math.floor(i/2)*18+4,
vx:(i%2?110:-110),vy:-260-Math.floor(i/2)*70,t:.9});}
function headBump(tx,ty){
const c=cell(tx,ty);
if(c==='?'||c==='M'){
level.g[ty][tx]='U';addBump(tx,ty);
if(c==='?'){spawnCoinPop(tx,ty);score+=200;addCoin();popup(tx*TILE+4,ty*TILE-30,'200','#ffd93d');Sfx.coin();}
else{spawnMush(tx,ty);Sfx.power();}}
else if(c==='B'){
if(player.big){level.g[ty][tx]=' ';debris(tx,ty);score+=50;Sfx.brick();}
else{addBump(tx,ty);Sfx.bump();}}
else if(SOLID.has(c))Sfx.bump();}
function moveX(e,dt){
e.x+=e.vx*dt;e.hitWall=false;
const y0=Math.floor(e.y/TILE),y1=Math.floor((e.y+e.h-1)/TILE);
if(e.vx>0){
const tx=Math.floor((e.x+e.w-1)/TILE);
for(let ty=y0;ty<=y1;ty++)if(SOLID.has(cell(tx,ty))){
e.x=tx*TILE-e.w;e.vx=0;e.hitWall=true;break;}}
else if(e.vx<0){
const tx=Math.floor(e.x/TILE);
for(let ty=y0;ty<=y1;ty++)if(SOLID.has(cell(tx,ty))){
e.x=(tx+1)*TILE;e.vx=0;e.hitWall=true;break;}}}
function moveY(e,dt,isPlayer){
e.y+=e.vy*dt;e.onGround=false;
const x0=Math.floor(e.x/TILE),x1=Math.floor((e.x+e.w-1)/TILE);
if(e.vy>0){
const ty=Math.floor((e.y+e.h-1)/TILE);
for(let tx=x0;tx<=x1;tx++)if(SOLID.has(cell(tx,ty))){
e.y=ty*TILE-e.h;e.vy=0;e.onGround=true;break;}}
else if(e.vy<0){
const ty=Math.floor(e.y/TILE);
let best=-1,bd=1e9;
for(let tx=x0;tx<=x1;tx++)if(SOLID.has(cell(tx,ty))){
const d=Math.abs(tx*TILE+TILE/2-(e.x+e.w/2));
if(d<bd){bd=d;best=tx;}}
if(best>=0){
e.y=(ty+1)*TILE;e.vy=0;
if(isPlayer)headBump(best,ty);}}}
function grow(){
const oh=player.h;
player.big=true;player.h=54;player.w=30;
player.y+=oh-player.h;player.x-=2;player.invuln=.6;}
function shrink(){
const oh=player.h;
player.big=false;player.h=34;player.w=26;
player.y+=oh-player.h;player.x+=2;player.invuln=1.5;}
function hurt(){
if(state!=='playing'||player.invuln>0)return;
if(player.big){shrink();Sfx.shrink();}
else die(false);}
function die(fall){
if(state!=='playing')return;
state='dying';deathT=fall?1.1:1.9;
player.vy=fall?0:-650;player.vx=0;
BGM.next=0;Sfx.die();}
function loadLevel(i,keep){
 levelIndex=i;
level=makeLevel(LEVELS[i]);
castleCol=level.flagCol+3;
ents=level.spawns.map(s=>({
type:s.type,
x:s.cx*TILE+(TILE-34)/2,y:s.feetRow*TILE-34,
w:34,h:34,vx:0,vy:0,dir:-1,
spd:s.type==='tobi'?45:70,
active:false,squish:0,dead:false,onGround:false,walk:0,
hopT:.5+Math.random()*.8}));
particles=[];
 if(!keep){player.w=26;player.h=34;player.big=false;}
 player.x=level.startCol*TILE+6;player.y=12*TILE-player.h-1;
player.vx=0;player.vy=0;player.facing=1;player.invuln=0;
player.onGround=true;player.walk=0;
cam.x=0;levelBanner=2.6;flagBonus=0;clearPending=false;
jumpBuffer=0;coyote=0;
state='playing';BGM.next=0;}
function startGame(){score=0;coinsN=0;lives=3;Sfx.start();loadLevel(0);}
function nextLevel(){
if(levelIndex+1>=LEVELS.length){state='win';BGM.next=0;}
 else loadLevel(levelIndex+1,true);}
function startFlag(){
if(state!=='playing')return;
state='flag';flagPhase='slide';flagT=0;
player.vx=0;player.vy=0;
player.x=level.flagCol*TILE+7;player.facing=1;
const ratio=(12*TILE-player.y)/(12*TILE-4*TILE);
flagBonus=ratio>.55?1000:ratio>.3?500:200;
BGM.next=0;Sfx.flag();}
function finishLevel(){
if(clearPending)return;
clearPending=true;
timeBonus=level.time*10;
score+=timeBonus+flagBonus;
state='clear';BGM.next=0;Sfx.clear();}
function primaryAction(){
Sfx.init();
if(state==='title')startGame();
else if(state==='clear')nextLevel();
else if(state==='gameover'||state==='win'){state='title';}
else if(state==='paused')state='playing';
else if(state==='playing')jumpBuffer=.12;}
function tileTriggers(){
const p=player;
const x0=Math.floor(p.x/TILE),x1=Math.floor((p.x+p.w-1)/TILE);
const y0=Math.floor(p.y/TILE),y1=Math.floor((p.y+p.h-1)/TILE);
for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
const c=cell(x,y);
if(c==='o'){level.g[y][x]=' ';score+=200;addCoin();Sfx.coin();}
else if(c==='^'){die(false);return;}
else if(c==='|'){startFlag();return;}}}
function updatePlaying(dt){
const p=player;
p.invuln=Math.max(0,p.invuln-dt);
const maxSpd=input.run?RUN:WALK;
const acc=p.onGround?ACC:ACC_A;
if(input.left&&!input.right){p.vx-=acc*dt;p.facing=-1;}
else if(input.right&&!input.left){p.vx+=acc*dt;p.facing=1;}
else{
const f=FRIC*dt;
if(p.vx>0)p.vx=Math.max(0,p.vx-f);
else p.vx=Math.min(0,p.vx+f);}
p.vx=Math.max(-RUN,Math.min(RUN,p.vx));
if(Math.abs(p.vx)>maxSpd){
const d=Math.min(FRIC*dt,Math.abs(p.vx)-maxSpd);
p.vx-=Math.sign(p.vx)*d;}
if(jumpBuffer>0&&(p.onGround||coyote>0)){
p.vy=-JUMP_V;p.onGround=false;coyote=0;jumpBuffer=0;Sfx.jump();}
jumpBuffer=Math.max(0,jumpBuffer-dt);
coyote=p.onGround?.1:Math.max(0,coyote-dt);
p.vy=Math.min(p.vy+GRAV*dt,MAXFALL);
moveX(p,dt);
moveY(p,dt,true);
if(p.onGround)p.walk+=Math.abs(p.vx)*dt*.045;
if(p.onGround)stompCombo=0;
tileTriggers();
if(state!=='playing')return;
level.timeAcc+=dt;
if(level.timeAcc>=.45){
level.timeAcc-=.45;level.time--;
if(level.time<=0){die(false);return;}}
if(p.y>VH+90){die(true);return;}
for(const e of ents){
if(e.dead)continue;
if(!e.active){if(e.x<cam.x+VW+90)e.active=true;else continue;}
if(e.squish>0){
e.squish-=dt;if(e.squish<=0)e.dead=true;
continue;}
if(e.type!=='mush'&&cell(Math.floor((e.x+(e.dir>0?e.w+3:-3))/TILE),Math.floor((e.y+e.h-3)/TILE))==='^')e.dir*=-1;
e.vx=e.dir*e.spd;
e.vy=Math.min(e.vy+GRAV*dt,MAXFALL);
moveX(e,dt);
if(e.hitWall)e.dir*=-1;
moveY(e,dt,false);
e.walk+=Math.abs(e.vx)*dt*.05;
if(e.type==='tobi'){
e.hopT-=dt;
if(e.hopT<=0&&e.onGround){e.vy=-540;e.hopT=.9+Math.random()*.6;}}
if(e.y>VH+80){e.dead=true;continue;}
if(overlap(p,e)){
if(e.type==='mush'){
e.dead=true;
if(!p.big){grow();Sfx.power();}
else{score+=1000;popup(e.x,e.y-8,'1000','#ffd93d');Sfx.coin();}}
else if(p.vy>0&&(p.y+p.h)-e.y<28){

b.addEventListener('pointerdown',on);
b.addEventListener('pointerup',off);
b.addEventListener('pointercancel',off);
b.addEventListener('pointerleave',off);});
function togglePause(){
if(state==='playing')state='paused';
else if(state==='paused')state='playing';}
window.addEventListener('blur',()=>{
input.left=input.right=input.jump=input.run=false;
if(state==='playing')state='paused';});
function canvasPoint(e){
const r=cvs.getBoundingClientRect();
return{x:(e.clientX-r.left)/r.width*VW,
y:(e.clientY-r.top)/r.height*VH};}
cvs.addEventListener('pointerdown',e=>{
Sfx.init();
const p=canvasPoint(e);
if(p.x>VW-140&&p.y<46){
Sfx.muted=!Sfx.muted;BGM.next=0;return;}
if(state==='title'||state==='clear'||state==='gameover'||state==='win'
||state==='paused')primaryAction();});
window.addEventListener('contextmenu',e=>e.preventDefault());
let last=0,acc=0;
function frame(now){
const dt=Math.min((now-last)/1000||0,.1);
last=now;acc+=dt;
let guard=0;
while(acc>=STEP&&guard++<8){update(STEP);acc-=STEP;}
render();
requestAnimationFrame(frame);}
resize();
loadLevel(0);
state='title';
requestAnimationFrame(now=>{last=now;requestAnimationFrame(frame);});
</script>
